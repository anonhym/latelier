name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual trigger for dry-running the workflow without cutting a tag.
  workflow_dispatch:

# Permissions required by softprops/action-gh-release to create the
# release and attach assets.
permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_glob: |
              release/*.dmg
              release/*.dmg.blockmap
              release/*.zip
              release/*.zip.blockmap
              release/latest-mac.yml
            build_script: electron-builder --mac --x64 --arm64
          - os: windows-latest
            artifact_glob: |
              release/*.exe
              release/*.exe.blockmap
              release/latest.yml
            build_script: electron-builder --win --x64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # See ci.yml for why this is `npm ci --ignore-scripts`.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # No project-managed ABI rebuild step: better-sqlite3 13 is an N-API
      # addon whose prebuilt binary serves every Node/Electron ABI.
      # electron-builder still prepares native dependencies while packaging,
      # but does not compile better-sqlite3 from source.
      - name: Build renderer + main
        run: npm run build

      # Fails the job when any signing/notarization secret is missing. Without
      # APPLE_API_* electron-builder skips notarization silently and would ship
      # an un-notarized build, so this check is load-bearing.
      - name: Check macOS signing secrets
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=()
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi

      # The secret APPLE_API_KEY holds the .p8 contents; electron-builder wants
      # the env var APPLE_API_KEY to be a path to that file.
      - name: Write App Store Connect API key
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY }}
        run: |
          umask 077
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      # No CSC_IDENTITY_AUTO_DISCOVERY here: electron-builder imports CSC_LINK
      # into a temporary keychain, signs with the Developer ID Application
      # identity and notarizes each .app (x64 and arm64) with the APPLE_API_*
      # credentials. The dmg itself is neither signed nor notarized.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # GitHub publishing is handled by the release step below; tell
          # electron-builder not to attempt its own publish.
          GH_TOKEN: ''
        run: npx ${{ matrix.build_script }} --publish never

      - name: Package (Windows)
        if: runner.os == 'Windows'
        env:
          # Windows stays unsigned (SmartScreen warns on first launch). The
          # Windows job must never receive CSC_LINK: electron-builder would try
          # to sign with the macOS certificate. Never set this to an empty
          # string; only the literal 'false' disables auto-discovery.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ''
        run: npx ${{ matrix.build_script }} --publish never

      # Fails the job if a packaged app ships with a fuse in the wrong state
      # (electron-builder.yml `electronFuses`), on every OS and arch slice.
      - name: Verify Electron fuses
        run: node scripts/verify-fuses.mjs

      # Validates the two .app bundles (the dmg is not notarized). The bundle
      # name contains an apostrophe, so every path stays quoted.
      - name: Verify signing and notarization
        if: runner.os == 'macOS'
        shell: bash
        run: |
          shopt -s nullglob
          apps=(release/mac/*.app release/mac-arm64/*.app)
          if [ "${#apps[@]}" -lt 2 ]; then
            echo "::error::Expected 2 .app bundles (x64 and arm64), found ${#apps[@]}"
            exit 1
          fi
          for app in "${apps[@]}"; do
            echo "== $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            out="$(spctl -a -t exec -vvv "$app" 2>&1)"
            echo "$out"
            if ! grep -q 'source=Notarized Developer ID' <<<"$out"; then
              echo "::error::$app is not accepted as Notarized Developer ID"
              exit 1
            fi
            xcrun stapler validate "$app"
          done

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: ${{ matrix.artifact_glob }}
          # Don't fail if a glob matches nothing (e.g., the .yml feed file
          # naming conventions vary across electron-builder versions).
          fail_on_unmatched_files: false
          # Created on first job to land; subsequent jobs append assets.
          generate_release_notes: true

      # workflow_dispatch runs (no tag) — keep the artifacts as workflow
      # outputs so we can grab them for testing the pipeline before tagging.
      - name: Upload as workflow artifact (dry-run only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.os }}
          path: release/
          retention-days: 7
