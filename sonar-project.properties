# Read by the SonarCloud scan step in .github/workflows/ci.yml. Automatic
# Analysis must stay off in the SonarCloud project settings: it cannot import
# coverage, and SonarCloud refuses a CI scan while it is on.
sonar.organization=anonhym
sonar.projectKey=anonhym_latelier

# Tests are declared as tests, which also keeps their deliberate repetition
# out of copy-paste detection.
sonar.sources=.
sonar.exclusions=tests/**
sonar.tests=tests

# One report per vitest project (scripts/run-tests.mjs), laid out by the `sonar`
# job in .github/workflows/ci.yml, which downloads each job's coverage artifact to
# coverage/<artifact name>/. The component project is sharded, so it has one
# report per shard; SonarCloud merges them all.
sonar.javascript.lcov.reportPaths=coverage/coverage-base/unit/lcov.info,coverage/coverage-base/integration/lcov.info,coverage/coverage-component-1/lcov.info,coverage/coverage-component-2/lcov.info,coverage/coverage-component-3/lcov.info,coverage/coverage-component-4/lcov.info
# Coverage is measured over electron/, src/ and shared/ only (vitest.config.ts).
sonar.coverage.exclusions=scripts/**,.claude/**,*.config.*
